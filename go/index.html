<title>Exposir — Light Meter for Film Photographers</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0C0C0C;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:24px;
  text-align:center;-webkit-font-smoothing:antialiased;overflow:hidden;
}
.wrap{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:380px;width:100%}
.icon{width:96px;height:96px;border-radius:22px;display:block;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.name{font-size:1.55rem;font-weight:700;letter-spacing:-.02em}
.copy{font-size:1.12rem;line-height:1.45;font-weight:500;color:#F0F0F0}
.sub{font-size:.85rem;color:#8A8A8A;letter-spacing:.01em}
.cta{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:17px 24px;margin-top:4px;
  background:linear-gradient(135deg,#FF8C00,#FFAA33);color:#0C0C0C;
  font-size:1.05rem;font-weight:700;text-decoration:none;border-radius:999px;
  box-shadow:0 6px 24px rgba(255,140,0,.3);
}
.cta:active{transform:scale(.98)}
.status{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:2px}
.status p{font-size:.8rem;color:#8A8A8A}
.bar{width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#FF8C00;border-radius:2px;animation:fill 1.5s linear forwards}
@keyframes fill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
@media (max-height:560px){.icon{width:72px;height:72px}.copy{font-size:1rem}.wrap{gap:14px}}
</style>
